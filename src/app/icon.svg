<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141E"/>
      <stop offset="100%" stop-color="#09090D"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF7A00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Letter A Gradient -->
    <linearGradient id="letterGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFE7D6"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Accent Dot Glow Filter -->
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Stroke -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Radial Glow Behind Letter -->
  <circle cx="256" cy="240" r="140" fill="#FF7A00" opacity="0.16" filter="url(#glow)"/>

  <!-- Geometric Monogram "A" -->
  <path
    d="M 256 90
       L 396 414
       L 322 414
       L 286 328
       L 226 328
       L 190 414
       L 116 414
       Z
       M 256 172
       L 297 274
       L 215 274
       Z"
    fill="url(#letterGrad)"
    fill-rule="evenodd"
  />

  <!-- Subtle Modern Accent Pip (Solar Orange Dot) -->
  <circle cx="256" cy="376" r="14" fill="#FF7A00" filter="url(#dotGlow)"/>
  <circle cx="256" cy="376" r="6" fill="#FFFFFF"/>
</svg>
